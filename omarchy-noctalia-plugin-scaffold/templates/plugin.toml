# Noctalia plugin manifest template.
# Copy to plugin.toml (pure Luau widget) or noctalia/plugin.toml (Python tool + widget).
# Every user-visible string is a *_key resolved from translations/en.json.

id = "allieb/my-widget"          # namespaced: <author>/<slug>
name = "My Widget"
version = "0.1.0"
plugin_api = 19                  # copy from an installed plugin, do not guess:
                                 # grep plugin_api ~/.config/noctalia/plugins/*/plugin.toml
author = "allieb"
license = "MIT"
icon = "layout-dashboard"        # Lucide-style icon name
description = "One line describing what this puts on the bar."
tags = ["bar", "hyprland"]
dependencies = ["hyprctl"]       # external commands the widget shells out to

# [[widget]] is what actually registers the widget with the shell — without it the
# plugin loads but nothing appears. Both screen-widget and tablet have exactly one.
[[widget]]
id = "my-widget"
entry = "widget.luau"

# [[setting]] blocks are optional (tablet's manifest has none).
[[setting]]
key = "display_mode"
type = "select"                  # select | bool | string | int (match an existing plugin)
label_key = "settings.display_mode.label"
description_key = "settings.display_mode.description"
default = "compact"
options = [
  { value = "compact", label_key = "settings.display_mode.compact" },
  { value = "full", label_key = "settings.display_mode.full" },
]

[[setting]]
key = "show_labels"
type = "bool"
label_key = "settings.show_labels.label"
description_key = "settings.show_labels.description"
default = true
